<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Smart Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📚 Smart Library</h1>
    <p>Create your demo account</p>
  </header>

  <main class="auth-card">
    <h2>Register</h2>
    <form id="registerForm">
      <label for="name">Full name</label>
      <input id="name" required placeholder="Enter your name">

      <label for="regEmail">Email address</label>
      <input id="regEmail" type="email" required placeholder="Enter your email">

      <label for="regPassword">Password</label>
      <input id="regPassword" type="password" minlength="4" required
             placeholder="At least 4 characters">

      <button type="submit">Register</button>
      <p id="message" class="message" role="status"></p>
    </form>
    <p>Already registered? <a href="login.html">Login</a></p>
  </main>

  <script src="auth.js"></script>
</body>
</html>
